<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightBoard Pro</title>
</head>
<body>
    <div id="root-js"></div>
    <div id="root"></div>
    <!-- Order of the cmd imports are matter for react and react-dom -->
    <script  crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script  crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script>
        const headingJS  = document.createElement("h2")
        headingJS.innerHTML = "Welcome to InsightBoard Pro!"
        const rootJS = document.getElementById("root-js")
        rootJS.appendChild(headingJS)

        function App() {
            const [count, setCount] = React.useState(0)
            const heading = React.createElement("div", {style: {padding : '20px'}} , 
            React.createElement("h1", {} , "InsightBoard Pro"),
            React.createElement("p", {} , "Step:1 React from CDN - No build tools"),
            [
                React.createElement("h1", {} , "InsightBoard Pro using Array"),
                React.createElement("p", {} , "Step:1 React from CDN - No build tools"),
                React.createElement("button", { onClick: () => setCount(count +  1), style:{padding:'10px 20px', marginRight:"10px"}}, count)
            ]
        )
            return heading
        }
       

        
        const root = ReactDOM.createRoot(document.getElementById("root"))
        root.render(React.createElement(App))
    </script>
    
</body>
</html>
